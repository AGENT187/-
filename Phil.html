
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гражданская авиация</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            background: url('img/fon.jpg') no-repeat center center fixed;
            background-size: cover;
          overflow: hidden;
          overflow-y: auto;
        } 
        h1 {
            margin-bottom: 10px;
        }
        p.description {
            font-size: 18px;
            margin-bottom: 30px;
            line-height:1.5;
        }
        .grid {
    display: grid;
    gap: 0;
    justify-content: center;
    margin: 20px auto;
}
.cell {
    width: 40px; 
    height: 40px; 
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px; 
    font-weight: bold;
    border: 1px solid #8bb2e7;
    background-color: #fff;
    cursor: pointer;
    user-select: none;
    transition: background-color 0.3s;
    box-sizing: border-box;
}
        .cell.selected {
            background-color: #ffd54f;
            z-index: 1;
        }
        .cell.correct {
            color: white;
            animation: flip 0.5s;
            border: none;
            background-color: #8bc34a;
        }
        .cell.extra {
            color: white;
            font-weight: bold;
            background-color: #ffd54f;
        }
        .status {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
        }
        .reset-icon {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 40px;
            height: 40px;
            background: url('img/reset-icon.svg') no-repeat center center;
            background-size: contain;
            cursor: pointer;
        }

        @keyframes flip {
            0% {
                transform: rotateY(0);
                background-color: #ffd54f;
            }
            50% {
                transform: rotateY(90deg);
            }
            100% {
                transform: rotateY(0);
            }
        }

        @keyframes firework {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            100% {
                transform: scale(3);
                opacity: 0;
            }
        }

        .firework {
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: yellow;
            border-radius: 50%;
            animation: firework 2s ease-out infinite;
        }
    </style>
</head>
<body>
    <div class="reset-icon" onclick="resetGame()"></div>
    <h1>Гражданская авиация</h1>
    <p class="description">Найди спрятанные в филворде слова.</p>
    <div class="grid" id="grid"></div>
    <div class="status" id="status">Осталось слов: 16</div>

    <audio id="success-sound" src="sound/success.mp3"></audio>
    <audio id="open-sound" src="sound/open.mp3"></audio>
    <audio id="right-sound" src="sound/right.mp3"></audio>
    <audio id="matching-touch" src="sound/matching_touch.mp3"></audio>
    <audio id="matching-untouch" src="sound/matching_untouch.mp3"></audio>

    <script>
        const words = [
    "МОЖАЙСКИЙ", "ТУПОЛЕВ", "ПИЛОТ", "САМОЛЕТ", "АВИАЦИЯ", "ФЛОТ", "ПАССАЖИР", "АВИАКОНСТРУКТОР", "АВИАСТРОЕНИЕ", "ЛАЙНЕР", "БОРТПРОВОДНИК", "КРЫЛО", "АЭРОПОРТ", "ПОЛЕТ", "БИПЛАН", "ДВИГАТЕЛЬ"
];
        const extraWords = [];
        const gridLetters = [
            "б", "д", "а", "в", "и", "а", "ц", "и", "я", "г", "б", "с", "а", "п", "а",
            "о", "с", "а", "р", "ь", "с", "а", "а", "к", "и", "и", "т", "э", "р", "в",
            "р", "а", "ф", "у", "б", "е", "т", "ж", "р", "т", "п", "и", "р", "ф", "и",
            "т", "м", "л", "с", "о", "л", "ю", "п", "а", "с", "л", "и", "о", "к", "а",
            "п", "о", "о", "л", "р", "к", "р", "е", "ф", "р", "а", "т", "п", "ц", "к",
            "р", "л", "т", "е", "о", "д", "я", "е", "т", "о", "н", "н", "о", "м", "о",
            "о", "е", "р", "е", "ф", "р", "а", "т", "р", "е", "ф", "а", "р", "г", "н",
            "в", "т", "м", "о", "ж", "а", "й", "с", "к", "и", "й", "ч", "т", "у", "с",
            "о", "к", "п", "ш", "а", "е", "с", "н", "ж", "п", "а", "ю", "и", "р", "т",
            "д", "в", "п", "а", "с", "с", "а", "ж", "и", "р", "р", "т", "п", "к", "р",
            "н", "в", "д", "в", "и", "г", "а", "т", "е", "л", "ь", "а", "о", "к", "у",
            "и", "и", "т", "у", "п", "о", "л", "е", "в", "ь", "л", "л", "л", "р", "к",
            "к", "н", "ь", "л", "а", "й", "н", "е", "р", "л", "а", "щ", "е", "к", "т",
            "п", "и", "л", "о", "т", "к", "к", "р", "ы", "л", "о", "п", "т", "к", "о",
            "а", "в", "и", "а", "с", "т", "р", "о", "е", "н", "и", "е", "р", "п", "р",

        ];

        const gridSize = 15;
        const gridElement = document.getElementById("grid");
        const statusElement = document.getElementById("status");
        let remainingWords = words.length;

        function renderGrid() {
    const gridElement = document.getElementById("grid");
    gridElement.style.gridTemplateColumns = `repeat(${gridSize}, 40px)`; 

    gridLetters.forEach((letter, index) => {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.textContent = letter.toUpperCase(); 
        cell.dataset.index = index; 
        cell.addEventListener("click", () => toggleCellSelection(cell));
        gridElement.appendChild(cell);
    });
}

        function toggleCellSelection(cell) {
            if (cell.classList.contains("correct")) return;

            const matchingTouchSound = document.getElementById("matching-touch");
            const matchingUntouchSound = document.getElementById("matching-untouch");

            if (cell.classList.contains("selected")) {
                cell.classList.remove("selected");
                matchingUntouchSound.play();
            } else {
                cell.classList.add("selected");
                matchingTouchSound.play();
                checkForWord();
            }
        }

        function checkForWord() {
            const selectedCells = Array.from(gridElement.querySelectorAll(".cell.selected"));
            const selectedWord = selectedCells.map(c => c.textContent).join("");

            if (words.includes(selectedWord)) {
                selectedCells.forEach(c => {
                    c.style.backgroundColor = "#8bc34a"; 
                    c.classList.add("correct");
                    c.classList.remove("selected");
                });
                remainingWords--;
                statusElement.textContent = `Осталось слов: ${remainingWords}`;

                document.getElementById("open-sound").play();
                if (remainingWords === 0) {
                    document.getElementById("right-sound").play();
                    setTimeout(() => clearInterval(fireworkInterval), 2000);
                    const fireworkInterval = setInterval(launchFireworks, 500);
                }
            } else if (extraWords.includes(selectedWord)) {
                selectedCells.forEach(c => {
                    c.style.backgroundColor = "#ffd54f"; 
                    c.classList.add("extra");
                    c.classList.remove("selected");
                });
                document.getElementById("open-sound").play();
            }
        }

        function resetGame() {
            gridElement.innerHTML = "";
            remainingWords = words.length;
            statusElement.textContent = `Осталось слов: ${remainingWords}`;
            renderGrid();
        }

        function launchFireworks() {
            const body = document.body;
            for (let i = 0; i < 15; i++) {
                const firework = document.createElement("div");
                firework.className = "firework";
                firework.style.left = Math.random() * window.innerWidth + "px";
                firework.style.top = Math.random() * window.innerHeight / 2 + "px";
                firework.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
                body.appendChild(firework);
                setTimeout(() => firework.remove(), 2000);
            }
        }

        renderGrid();
    </script>
</body>
</html>
